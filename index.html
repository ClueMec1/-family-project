<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Image Generator</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --accent: #ff007a;
      --text: #f0f0f5;
      --text-dim: #a0a0b0;
      --border: #2e2e38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      text-align: center;
      background: linear-gradient(135deg, #ff007a, #9600ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #16161a;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .row {
      display: flex;
      gap: 1rem;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff007a, #7928ca);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .preview-box {
      margin-top: 1.5rem;
      min-height: 300px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background-color: #16161a;
    }

    .preview-box img {
      width: 100%;
      height: auto;
      display: none;
      border-radius: 10px;
    }

    .status-text {
      color: var(--text-dim);
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem;
    }

    .download-btn {
      display: none;
      margin-top: 1rem;
      background: #22c55e;
      text-decoration: none;
      text-align: center;
      line-height: 2.5rem;
      color: white;
      font-weight: bold;
      border-radius: 8px;
    }

    .download-btn:hover {
      background: #16a34a;
    }

    .spinner {
      display: none;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI Image Generator</h1>
    <p class="subtitle">Generate & download AI artwork using free APIs</p>

    <div class="form-group">
      <label for="apiSelect">Select API Provider</label>
      <select id="apiSelect" onchange="toggleApiKeyInput()">
        <option value="pollinations">Pollinations.ai (Free - No API Key Needed)</option>
        <option value="huggingface">Hugging Face (Free Token Required)</option>
      </select>
    </div>

    <div class="form-group" id="apiKeyContainer" style="display: none;">
      <label for="apiKey">Hugging Face Access Token (User Read/Write Token)</label>
      <input type="password" id="apiKey" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx">
    </div>

    <div class="form-group">
      <label for="prompt">Image Prompt</label>
      <textarea id="prompt" placeholder="A futuristic city with flying cars at sunset, cyberpunk style, highly detailed..."></textarea>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="width">Width</label>
        <select id="width">
          <option value="512">512 px</option>
          <option value="768">768 px</option>
          <option value="1024" selected>1024 px</option>
        </select>
      </div>

      <div class="form-group">
        <label for="height">Height</label>
        <select id="height">
          <option value="512">512 px</option>
          <option value="768">768 px</option>
          <option value="1024" selected>1024 px</option>
        </select>
      </div>
    </div>

    <button id="generateBtn" onclick="generateImage()">Generate Picture</button>

    <div class="preview-box">
      <div class="spinner" id="spinner"></div>
      <p class="status-text" id="statusText">Your generated image will appear here</p>
      <img id="resultImg" alt="Generated AI Image" />
    </div>

    <a id="downloadBtn" class="download-btn" href="#" download="ai-generated-image.png">Download Picture</a>
  </div>

  <script>
    function toggleApiKeyInput() {
      const apiSelect = document.getElementById('apiSelect').value;
      const apiKeyContainer = document.getElementById('apiKeyContainer');
      apiKeyContainer.style.display = (apiSelect === 'huggingface') ? 'block' : 'none';
    }

    async function generateImage() {
      const prompt = document.getElementById('prompt').value.trim();
      const api = document.getElementById('apiSelect').value;
      const width = document.getElementById('width').value;
      const height = document.getElementById('height').value;
      
      const generateBtn = document.getElementById('generateBtn');
      const spinner = document.getElementById('spinner');
      const statusText = document.getElementById('statusText');
      const resultImg = document.getElementById('resultImg');
      const downloadBtn = document.getElementById('downloadBtn');

      if (!prompt) {
        alert('Please enter a prompt description!');
        return;
      }

      // Reset UI state
      generateBtn.disabled = true;
      spinner.style.display = 'block';
      statusText.innerText = 'Creating image... This might take a few seconds.';
      resultImg.style.display = 'none';
      downloadBtn.style.display = 'none';

      try {
        let imageUrl = '';

        if (api === 'pollinations') {
          // Pollinations.ai API URL construction
          const seed = Math.floor(Math.random() * 1000000);
          const encodedPrompt = encodeURIComponent(prompt);
          imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;

          // Preload image to ensure completion before displaying
          await new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = resolve;
            img.onerror = reject;
            img.src = imageUrl;
          });

        } else if (api === 'huggingface') {
          const apiKey = document.getElementById('apiKey').value.trim();
          if (!apiKey) {
            alert('Please enter your free Hugging Face API Access Token!');
            generateBtn.disabled = false;
            spinner.style.display = 'none';
            statusText.innerText = 'API key required for Hugging Face.';
            return;
          }

          // Hugging Face Inference API call (SDXL Base 1.0)
          const response = await fetch(
            'https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0',
            {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ inputs: prompt }),
            }
          );

          if (!response.ok) {
            throw new Error(`Hugging Face API Error: ${response.statusText}`);
          }

          const blob = await response.blob();
          imageUrl = URL.createObjectURL(blob);
        }

        // Show Generated Image
        resultImg.src = imageUrl;
        resultImg.style.display = 'block';
        statusText.style.display = 'none';

        // Prepare Download Button via Blob conversion to bypass CORS download restrictions
        fetchAndSetDownload(imageUrl);

      } catch (error) {
        console.error(error);
        statusText.innerText = 'Failed to generate image. Please try again.';
        statusText.style.display = 'block';
      } finally {
        generateBtn.disabled = false;
        spinner.style.display = 'none';
      }
    }

    // Convert image URL to downloadable local Blob
    async function fetchAndSetDownload(url) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = blobUrl;
        downloadBtn.style.display = 'block';
      } catch (err) {
        console.error('Download setup failed:', err);
      }
    }
  </script>
</body>
</html>
