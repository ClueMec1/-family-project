<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Bypass Runner</title>
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1e1e2e">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #11111b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #313244; }
    h1 { font-size: 1.2rem; color: #a6e3a1; }
    .controls { display: flex; gap: 10px; }
    button, label { background: #313244; color: #cdd6f4; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
    button:hover, label:hover { background: #45475a; }
    .run-btn { background: #a6e3a1; color: #11111b; }
    .run-btn:hover { background: #94e2d5; }
    input[type="file"] { display: none; }
    .app-container { display: flex; flex: 1; overflow: hidden; }
    .panel { flex: 1; display: flex; flex-direction: column; height: 100%; border-right: 1px solid #313244; }
    .panel-header { background: #181825; padding: 6px 15px; font-size: 0.8rem; text-transform: uppercase; color: #bac2de; font-weight: bold; }
    textarea { flex: 1; background: #1e1e2e; color: #f5e0dc; border: none; resize: none; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 1rem; outline: none; line-height: 1.5; }
    .preview-container { flex: 1; background: #fff; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #ffffff; }
  </style>
</head>
<body>

  <header>
    <h1>🌐 Offline HTML Runner Sandbox</h1>
    <div class="controls">
      <label for="file-input">📂 Load HTML File</label>
      <input type="file" id="file-input" accept=".html,.txt">
      <button class="run-btn" id="run-btn">▶ Run Code</button>
    </div>
  </header>

  <div class="app-container">
    <div class="panel">
      <div class="panel-header">Source Code (HTML / CSS / JS)</div>
      <textarea id="code-editor" placeholder="<!-- Paste or type your HTML here -->
<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f4f8; }
    h1 { color: #333; }
  </style>
</head>
<body>
  <h1>🎉 Sandbox Isolated Environment Working!</h1>
  <p>Your scripts and styles will run locally here without network restrictions.</p>
</body>
</html>"></textarea>
    </div>
    
    <div class="panel" style="border-right: none;">
      <div class="panel-header">Isolated Real Browser Preview</div>
      <div class="preview-container">
        <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
